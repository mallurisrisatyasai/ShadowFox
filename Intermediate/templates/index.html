<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Price Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Center Card */
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 40px;
        }

        /* NEW: Hero Image Styling */
        .hero-image {
            width: 100%;
            max-width: 280px;
            display: block;
            margin: 0 auto 20px auto;
            /* Centers the image */
            border-radius: 12px;
        }

        .card h2 {
            text-align: center;
            color: #1a202c;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        /* Grid Layout for Inputs */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* Make Kms Driven take up the full width */
        .full-width {
            grid-column: 1 / -1;
        }

        /* Input Styling */
        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            margin-bottom: 8px;
            font-size: 14px;
            color: #4a5568;
            font-weight: 500;
        }

        .input-group input,
        .input-group select {
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            color: #2d3748;
            background-color: #f8fafc;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
            background-color: white;
        }

        /* Button Styling */
        .submit-btn {
            margin-top: 30px;
            width: 100%;
            padding: 16px;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            box-shadow: 0 4px 6px rgba(66, 153, 225, 0.2);
        }

        .submit-btn:hover {
            background: #3182ce;
            transform: translateY(-1px);
        }

        /* Prediction Result Box */
        .result-box {
            margin-top: 30px;
            text-align: center;
        }

        .result-box h3 {
            color: #2f855a;
            font-size: 20px;
            background: #f0fff4;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #c6f6d5;
            display: inline-block;
            width: 100%;
        }

        /* Mobile Responsiveness */
        @media(max-width: 500px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="{{ url_for('static', filename='car_image.png') }}" alt="Car Prediction AI" class="hero-image">

        <h2>Car Price Predictor</h2>

        <form action="/predict" method="POST">
            <div class="form-grid">

                <div class="input-group">
                    <label>Year of Manufacture</label>
                    <input type="number" name="Year" required placeholder="e.g. 2018">
                </div>

                <div class="input-group">
                    <label>Showroom Price (Lakhs)</label>
                    <input type="number" step="0.01" name="Present_Price" required placeholder="e.g. 8.5">
                </div>

                <div class="input-group full-width">
                    <label>Kilometers Driven</label>
                    <input type="number" name="Kms_Driven" required placeholder="e.g. 45000">
                </div>

                <div class="input-group">
                    <label>Previous Owners</label>
                    <select name="Owner">
                        <option value="0">0 (First Owner)</option>
                        <option value="1">1 (Second Owner)</option>
                        <option value="2">2 (Third Owner)</option>
                        <option value="3">3 or more</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Fuel Type</label>
                    <select name="Fuel_Type">
                        <option value="Petrol">Petrol</option>
                        <option value="Diesel">Diesel</option>
                        <option value="CNG">CNG</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Seller Type</label>
                    <select name="Seller_Type">
                        <option value="Dealer">Dealer</option>
                        <option value="Individual">Individual</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Transmission</label>
                    <select name="Transmission">
                        <option value="Manual">Manual</option>
                        <option value="Automatic">Automatic</option>
                    </select>
                </div>

            </div>

            <button type="submit" class="submit-btn">Estimate Selling Price</button>
        </form>

        {% if prediction_text %}
        <div class="result-box">
            <h3>{{ prediction_text }}</h3>
        </div>
        {% endif %}

    </div>

</body>

</html>
